const CURRENT_YEAR = 2026;
const STORAGE_KEY = "wineCellarData";

function toNum(v) {
  const n = parseFloat(v);
  return isNaN(n) ? 0 : n;
}

function classify(variety) {
  const v = variety.toLowerCase();
  if (/sparkling|grand vintage/.test(v)) return "Sparkling";
  if (/ros[ée]/.test(v)) return "Rosé";
  if (/riesling|chardonnay|marsanne|pinot gris|sauvignon blanc|gruner|semillon/.test(v)) return "White";
  return "Red";
}

function parseDrinkWindow(raw) {
  const s = (raw || "").trim();
  if (!s) return { status: "unknown", label: "No date recorded" };
  const openEnded = /\+/.test(s);
  const nums = (s.match(/\d{2,4}/g) || []).map(Number);
  if (nums.length === 0) return { status: "unknown", label: "No date recorded" };

  if (nums.length === 1) {
    const y = nums[0];
    if (openEnded) {
      if (CURRENT_YEAR >= y) return { status: "ready", label: `Drinking well since ${y}` };
      return { status: "cellaring", label: `Cellar until ${y}` };
    }
    if (CURRENT_YEAR < y - 1) return { status: "cellaring", label: `Cellar until ~${y}` };
    if (CURRENT_YEAR > y + 2) return { status: "overdue", label: `Past its ${y} window — drink soon` };
    return { status: "ready", label: `In its drinking window (to ~${y})` };
  }

  let start = nums[0];
  let end = nums[1];
  if (end < 100) end = Math.floor(start / 100) * 100 + end;
  if (CURRENT_YEAR < start) return { status: "cellaring", label: `Cellar until ${start}` };
  if (CURRENT_YEAR <= end) return { status: "ready", label: `Drinking window open (${start}–${end})` };
  if (openEnded) return { status: "ready", label: `Drinking well now (open since ${end})` };
  return { status: "overdue", label: `Past its ${start}–${end} window — drink soon` };
}

const STATUS_META = {
  ready: { label: "Ready", color: "var(--st-ready)" },
  cellaring: { label: "Cellaring", color: "var(--st-cellaring)" },
  overdue: { label: "Drink soon", color: "var(--st-overdue)" },
  unknown: { label: "Unrated window", color: "var(--st-unknown)" },
};

function normalize(w) {
  return { ...w, qty: toNum(w.qty), pricePerBottle: toNum(w.pricePerBottle), totalPrice: toNum(w.totalPrice) };
}

function CellarApp() {

  const [tab, setTab] = useState("cellar");
  const [search, setSearch] = useState("");
  const [colorFilter, setColorFilter] = useState("All");
  const [statusFilter, setStatusFilter] = useState("All");
  const [selected, setSelected] = useState(null);
  const [editing, setEditing] = useState(null);
  const [confirmDelete, setConfirmDelete] = useState(false);

  useEffect(() => {
    try {
      const stored = localStorage.getItem(STORAGE_KEY);
      if (stored) {
        setWines(JSON.parse(stored));
      } else {
        const initial = RAW_WINES.map(normalize);
        setWines(initial);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(initial));
      }
    } catch (e) {
      setWines(RAW_WINES.map(normalize));
    }
  }, []);

  function persist(next) {
    setWines(next);
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(next)); } catch (e) {}
  }

  const filtered = useMemo(() => {
    if (!wines) return [];
    const term = search.trim().toLowerCase();
    return wines
      .filter((w) => w.qty > 0)
      .filter((w) => {
        if (term && !(w.label.toLowerCase().includes(term) || w.variety.toLowerCase().includes(term))) return false;
        if (colorFilter !== "All" && classify(w.variety) !== colorFilter) return false;
        if (statusFilter !== "All" && parseDrinkWindow(w.cellarRaw).status !== statusFilter) return false;
        return true;
      })
      .sort((a, b) => a.label.localeCompare(b.label));
  }, [wines, search, colorFilter, statusFilter]);

  const stats = useMemo(() => {
    if (!wines) return null;
    const active = wines.filter((w) => w.qty > 0);
    const totalBottles = active.reduce((s, w) => s + w.qty, 0);
    const totalValue = active.reduce((s, w) => s + w.pricePerBottle * w.qty, 0);
    const byColor = {};
    const byStatus = { ready: 0, cellaring: 0, overdue: 0, unknown: 0 };
    active.forEach((w) => {
      const c = classify(w.variety);
      byColor[c] = (byColor[c] || 0) + w.qty;
      byStatus[parseDrinkWindow(w.cellarRaw).status] += w.qty;
    });
    const rated = active.filter((w) => w.rating && /^\d+/.test(w.rating));
    const avgRating = rated.length ? (rated.reduce((s, w) => s + parseInt(w.rating), 0) / rated.length).toFixed(1) : null;
    return { totalBottles, totalValue, byColor, byStatus, avgRating, distinctLabels: active.length };
  }, [wines]);

  function updateQty(wine, delta) {
    const next = wines.map((w) => {
      if (w.id !== wine.id) return w;
      const qty = Math.max(0, w.qty + delta);
      return { ...w, qty, totalPrice: qty * w.pricePerBottle };
    });
    persist(next);
    if (selected && selected.id === wine.id) setSelected(next.find((w) => w.id === wine.id));
  }

  function removeWine(wine) {
    persist(wines.filter((w) => w.id !== wine.id));
    setSelected(null);
    setConfirmDelete(false);
  }

  function saveWine(form) {
    const qty = toNum(form.qty);
    const pricePerBottle = toNum(form.pricePerBottle);
    const payload = { ...form, qty, pricePerBottle, totalPrice: qty * pricePerBottle };
    let next;
    if (form.id) {
      next = wines.map((w) => (w.id === form.id ? { ...w, ...payload } : w));
    } else {
      const maxId = wines.reduce((m, w) => Math.max(m, w.id), 0);
      next = [...wines, { ...payload, id: maxId + 1 }];
    }
    persist(next);
    setEditing(null);
    setTab("cellar");
  }

  function exportCsv() {
    const headers = ["label","variety","vintage","rating","qty","cellarRaw","fridge","shelf","box","pricePerBottle","totalPrice"];
    const rows = wines.map((w) => headers.map((h) => `"${String(w[h] ?? "").replace(/"/g, '""')}"`).join(","));
    const csv = [headers.join(","), ...rows].join("\n");
    const blob = new Blob([csv], { type: "text/csv" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "cellar_export.csv";
    a.click();
    URL.revokeObjectURL(url);
  }

  if (!wines) {
    return <div className="loading">Opening the cellar…</div>;
  }

  return (
    <div className="cellar-root">
      {tab === "cellar" && !selected && !editing && (
        <div className="screen">
          <header className="hero">
            <div className="hero-label">The cellar</div>

              <button key={s.k} className={"chip chip-status" + (statusFilter === s.k ? " chip-active" : "")} onClick={() => setStatusFilter(s.k)}>{s.l}</button>
            ))}
          </div>

          <div className="list">
            {filtered.length === 0 && (
              <div className="empty"><Icon name="wine" size={28} /><p>No bottles match. Try a different search or filter.</p></div>
            )}
            {filtered.map((w) => {
              const dw = parseDrinkWindow(w.cellarRaw);
              const meta = STATUS_META[dw.status];
              return (
                <button className="label-card" key={w.id} onClick={() => setSelected(w)}>
                  <div className="label-vintage">{w.vintage}</div>
                  <div className="label-body">
                    <div className="label-name">{w.label}</div>
                    <div className="label-variety">{w.variety}</div>
                    <div className="label-loc"><Icon name="mapPin" size={11} /> {w.fridge || "—"}{w.shelf ? ` · ${w.shelf}` : ""}</div>
                  </div>
                  <div className="label-side">
                    <div className="qty-badge">{w.qty}</div>
                    <div className="status-dot" style={{ background: meta.color }} title={dw.label} />
                  </div>
                </button>
              );
            })}
          </div>
        </div>
      )}

      {selected && (
        <div className="screen">
          <button className="back-btn" onClick={() => setSelected(null)}><Icon name="chevronLeft" size={18}/> Cellar</button>
          <div className="detail-card">
            <div className="detail-vintage">{selected.vintage}</div>
            <div className="detail-name">{selected.label}</div>
            <div className="detail-variety">{selected.variety}</div>
            {selected.photo && <img className="detail-photo" src={selected.photo} alt="Label" />}
            {(() => {
              const dw = parseDrinkWindow(selected.cellarRaw);
              const meta = STATUS_META[dw.status];
              return <div className="detail-status" style={{ borderColor: meta.color, color: meta.color }}>{dw.label}</div>;
            })()}
            <div className="detail-grid">
              <div className="detail-field"><div className="detail-field-label">Location</div><div className="detail-field-value">{selected.fridge || "—"}{selected.shelf ? ` · ${selected.shelf}` : ""}{selected.box ? ` · Box ${selected.box}` : ""}</div></div>
              <div className="detail-field"><div className="detail-field-label">Rating</div><div className="detail-field-value">{selected.rating || "—"}</div></div>
              <div className="detail-field"><div className="detail-field-label">Price / bottle</div><div className="detail-field-value">${selected.pricePerBottle.toFixed(2)}</div></div>
              <div className="detail-field"><div className="detail-field-label">Total value</div><div className="detail-field-value">${(selected.qty * selected.pricePerBottle).toFixed(2)}</div></div>
            </div>
            <div className="qty-control">
              <div className="qty-control-label">In cellar</div>
              <div className="qty-stepper">
                <button aria-label="Remove one bottle" onClick={() => updateQty(selected, -1)}><Icon name="minus" size={16}/></button>
                <span>{selected.qty}</span>
                <button aria-label="Add one bottle" onClick={() => updateQty(selected, 1)}><Icon name="plus" size={16}/></button>
              </div>
            </div>
            <div className="detail-actions">
              <button className="btn btn-secondary" onClick={() => setEditing(selected)}>Edit details</button>
              <button className="btn btn-danger" onClick={() => setConfirmDelete(true)}><Icon name="trash" size={14}/> Remove</button>
            </div>
            {confirmDelete && (
              <div className="confirm-box">
                <p>Remove this entry from your cellar log entirely?</p>
                <div className="confirm-actions">
                  <button className="btn btn-secondary" onClick={() => setConfirmDelete(false)}>Cancel</button>
                  <button className="btn btn-danger" onClick={() => removeWine(selected)}>Remove</button>
                </div>
              </div>
            )}
          </div>
        </div>
      )}

      {(tab === "add" || editing) && (
        <WineForm initial={editing} onCancel={() => { setEditing(null); setTab("cellar"); }} onSave={saveWine} />
      )}

      {tab === "stats" && !editing && (
        <div className="screen">

            <div className="stat-card"><div className="stat-label">Distinct labels</div><div className="stat-value">{stats.distinctLabels}</div></div>
            <div className="stat-card"><div className="stat-label">Avg. rating</div><div className="stat-value">{stats.avgRating || "—"}</div></div>

                <div className="bar-row-value">{v}</div>

            ))}
          </div>

            {[{k:"ready",l:"Ready"},{k:"cellaring",l:"Cellaring"},{k:"overdue",l:"Drink soon"},{k:"unknown",l:"Unrated window"}].map(({k,l}) => (

}

function resizeImage(file, maxWidth) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxWidth / img.width);
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", 0.7));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function WineForm({ initial, onCancel, onSave }) {
  const [form, setForm] = useState(initial || { id: null, label: "", variety: "", vintage: "", rating: "", qty: 1, cellarRaw: "", fridge: "", shelf: "", box: "", pricePerBottle: "", photo: "" });
  const [photoBusy, setPhotoBusy] = useState(false);
  function set(field, value) { setForm((f) => ({ ...f, [field]: value })); }
  async function handlePhoto(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    setPhotoBusy(true);
    try {
      const dataUrl = await resizeImage(file, 800);
      set("photo", dataUrl);
    } catch (err) {
      // ignore, leave photo unset
    }
    setPhotoBusy(false);
  }
  return (
    <div className="screen form-screen">
      <button className="back-btn" onClick={onCancel}><Icon name="chevronLeft" size={18}/> Cancel</button>
      <div className="form-title">{initial ? "Edit bottle" : "Add a bottle"}</div>

      <label className="field-label">Label photo</label>
      <div className="photo-row">
        {form.photo ? (
          <img className="photo-preview" src={form.photo} alt="Label" />
        ) : (
          <div className="photo-placeholder">No photo yet</div>
        )}
        <div className="photo-actions">
          <label className="btn btn-secondary photo-btn">
            {photoBusy ? "Processing…" : form.photo ? "Retake photo" : "Take photo"}
            <input type="file" accept="image/*" capture="environment" style={{ display: "none" }} onChange={handlePhoto} />
          </label>
          {form.photo && (
            <button className="btn btn-secondary photo-btn" onClick={() => set("photo", "")}>Remove</button>
          )}
        </div>
      </div>

      <label className="field-label">Label / producer</label>
      <input className="field-input" value={form.label} onChange={(e) => set("label", e.target.value)} placeholder="e.g. Bleasdale" />
      <label className="field-label">Variety / wine name</label>
      <input className="field-input" value={form.variety} onChange={(e) => set("variety", e.target.value)} placeholder="e.g. Old Vine Shiraz" />
      <div className="field-row">
        <div className="field-col"><label className="field-label">Vintage</label><input className="field-input" value={form.vintage} onChange={(e) => set("vintage", e.target.value)} placeholder="2021" /></div>
        <div className="field-col"><label className="field-label">Rating</label><input className="field-input" value={form.rating} onChange={(e) => set("rating", e.target.value)} placeholder="95" /></div>
      </div>
      <div className="field-row">
        <div className="field-col"><label className="field-label">Quantity</label><input type="number" min="0" className="field-input" value={form.qty} onChange={(e) => set("qty", e.target.value)} /></div>
        <div className="field-col"><label className="field-label">Price / bottle ($)</label><input type="number" min="0" step="0.01" className="field-input" value={form.pricePerBottle} onChange={(e) => set("pricePerBottle", e.target.value)} /></div>
      </div>
      <label className="field-label">Cellaring date</label>
      <input className="field-input" value={form.cellarRaw} onChange={(e) => set("cellarRaw", e.target.value)} placeholder="e.g. 2035 or 2028-2034" />
      <div className="field-row">
        <div className="field-col"><label className="field-label">Fridge / rack</label><input className="field-input" value={form.fridge} onChange={(e) => set("fridge", e.target.value)} placeholder="Left / Middle / Right / Box" /></div>
        <div className="field-col"><label className="field-label">Shelf position</label><input className="field-input" value={form.shelf} onChange={(e) => set("shelf", e.target.value)} placeholder="Shelf 2 Row 1" /></div>
      </div>
      <label className="field-label">Box code</label>
      <input className="field-input" value={form.box} onChange={(e) => set("box", e.target.value)} placeholder="optional" />
      <button className="btn btn-primary form-submit" onClick={() => { if (!form.label.trim()) return; onSave(form); }}>{initial ? "Save changes" : "Add to cellar"}</button>
    </div>
  );
}
